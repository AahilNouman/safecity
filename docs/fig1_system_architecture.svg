<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#FFFFFF;">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B83A5D"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>

    <!-- Filters for subtle clean shadow -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .tier-label { font-family: 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #64748B; letter-spacing: 1.5px; }
    .box-title { font-family: 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #0F172A; }
    .box-sub { font-family: 'Times New Roman', serif; font-size: 12px; fill: #334155; }
    .badge { font-family: 'Times New Roman', serif; font-size: 11px; font-weight: bold; }
    .flow-label { font-family: 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #475569; }
  </style>

  <!-- Outer Border Container -->
  <rect x="15" y="15" width="1170" height="650" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ========================================== -->
  <!-- TIER 1: CLIENT & USER INTERACTION TIER -->
  <!-- ========================================== -->
  <text x="45" y="52" class="tier-label">TIER 1: CLIENT PRESENTATION &amp; ACTORS</text>
  <line x1="45" y1="60" x2="1155" y2="60" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Box 1A: Citizen Commuter Client -->
  <g filter="url(#boxShadow)">
    <rect x="50" y="75" width="480" height="125" rx="8" fill="#FFFFFF" stroke="#B83A5D" stroke-width="2"/>
    <rect x="50" y="75" width="480" height="32" rx="8" fill="#FCE7F3"/>
    <text x="70" y="97" class="box-title" fill="#9D174D">Citizen Mobile Client (PWA / Android Hybrid)</text>
    <text x="70" y="126" class="box-sub">• Anonymous Incident Reporting (Categorical classification &amp; narrative)</text>
    <text x="70" y="146" class="box-sub">• Client-Side 3-Decimal Spatial Quantization (~110m privacy grid)</text>
    <text x="70" y="166" class="box-sub">• Walk With Me Escort Session &amp; Multi-Criteria Corridor Request</text>
  </g>

  <!-- Box 1B: Administrative Moderator -->
  <g filter="url(#boxShadow)">
    <rect x="670" y="75" width="480" height="125" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <rect x="670" y="75" width="480" height="32" rx="8" fill="#F1F5F9"/>
    <text x="690" y="97" class="box-title">Administrative Moderator Portal (RBAC)</text>
    <text x="690" y="126" class="box-sub">• Queue Review &amp; Spatial Corroboration of Incoming Reports</text>
    <text x="690" y="146" class="box-sub">• Status Lifecycle Management: PENDING ➔ VERIFIED / DISMISSED</text>
    <text x="690" y="166" class="box-sub">• 24/7 Verified Safe Haven Directory Administration</text>
  </g>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <!-- Citizen to API -->
  <path d="M 290 200 L 290 265" fill="none" stroke="#B83A5D" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="200" y="218" width="180" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="290" y="233" text-anchor="middle" class="flow-label">Encrypted REST / JSON Payload</text>

  <!-- Moderator to API -->
  <path d="M 910 200 L 910 265" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="830" y="218" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="910" y="233" text-anchor="middle" class="flow-label">Authenticated Session Token</text>


  <!-- ========================================== -->
  <!-- TIER 2: SERVICES & COMPUTATION TIER -->
  <!-- ========================================== -->
  <text x="45" y="252" class="tier-label">TIER 2: SERVICES, ROUTING &amp; INTELLIGENCE</text>
  <line x1="45" y1="260" x2="1155" y2="260" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Box 2A: Backend API Gateway -->
  <g filter="url(#boxShadow)">
    <rect x="50" y="275" width="480" height="145" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="50" y="275" width="480" height="32" rx="8" fill="#DBEAFE"/>
    <text x="70" y="297" class="box-title" fill="#1E40AF">SafeCity Core Backend (Node.js &amp; Express 4.19)</text>
    <text x="70" y="326" class="box-sub">• Data Sanitization, Payload Validation &amp; Rate-Limiting</text>
    <text x="70" y="346" class="box-sub">• Role-Based Access Control (Public Telemetry vs. Moderator Ops)</text>
    <text x="70" y="366" class="box-sub">• Real-Time Incident State Synchronization (Auto-Poller)</text>
    <text x="70" y="386" class="box-sub">• Location Obfuscation Pipeline (Enforcing DPDP / Privacy Standards)</text>
  </g>

  <!-- Box 2B: Multi-Criteria Routing Engine -->
  <g filter="url(#boxShadow)">
    <rect x="670" y="275" width="480" height="145" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="670" y="275" width="480" height="32" rx="8" fill="#D1FAE5"/>
    <text x="690" y="297" class="box-title" fill="#065F46">Multi-Criteria Safety-Aware Pathfinding Engine</text>
    <text x="690" y="326" class="box-sub">• OSRM Open Road-Network Pedestrian Routing Integration</text>
    <text x="690" y="346" class="box-sub">• Gaussian Spatial &amp; Exponential Temporal Crime Decay Penalty</text>
    <text x="690" y="366" class="box-sub">• 24/7 Safe Haven Proximity Additive Reinforcement (+8 pts/haven)</text>
    <text x="690" y="386" class="box-sub">• Dynamic Corridor Safety Scoring: S_route ∈ [10, 98]</text>
  </g>

  <!-- Horizontal connector between 2A and 2B -->
  <path d="M 530 347 L 670 347" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="333" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="600" y="348" text-anchor="middle" class="flow-label">Verified Layer</text>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <path d="M 290 420 L 290 485" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="220" y="440" width="140" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="290" y="455" text-anchor="middle" class="flow-label">CRUD Spatial Queries</text>

  <path d="M 910 420 L 910 485" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="830" y="440" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="910" y="455" text-anchor="middle" class="flow-label">Real-Time GPS Telemetry</text>


  <!-- ========================================== -->
  <!-- TIER 3: DATA PERSISTENCE & ACTIVE TELEMETRY -->
  <!-- ========================================== -->
  <text x="45" y="472" class="tier-label">TIER 3: DATA PERSISTENCE &amp; ACTIVE ESCORT</text>
  <line x1="45" y1="480" x2="1155" y2="480" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Box 3A: Spatial Database Partition -->
  <g filter="url(#boxShadow)">
    <rect x="50" y="495" width="480" height="135" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <rect x="50" y="495" width="480" height="32" rx="8" fill="#EEF2FF"/>
    <text x="70" y="517" class="box-title" fill="#4338CA">Spatial Database &amp; Partitioned Storage (MySQL 8.0)</text>
    <text x="70" y="546" class="box-sub">• Quantized Incident Table (lat, lng, category, severity, timestamp)</text>
    <text x="70" y="566" class="box-sub">• Verified Safe Havens Table (24/7 hospitals, police booths, fuel bunks)</text>
    <text x="70" y="586" class="box-sub">• Encrypted Admin Audit Logs &amp; Moderator Credentials (Argon2 / SHA)</text>
    <text x="70" y="606" class="box-sub">• Ephemeral Client Cache via IndexedDB &amp; Service Worker Offline Shell</text>
  </g>

  <!-- Box 3B: Walk With Me Escort & Watchdog Engine -->
  <g filter="url(#boxShadow)">
    <rect x="670" y="495" width="480" height="135" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="670" y="495" width="480" height="32" rx="8" fill="#FEF3C7"/>
    <text x="690" y="517" class="box-title" fill="#B45309">Walk With Me Companion &amp; Watchdog Engine</text>
    <text x="690" y="546" class="box-sub">• Continuous Haversine Distance &amp; Instantaneous Velocity Tracking</text>
    <text x="690" y="566" class="box-sub">• Autonomous 180-Second Stationary Inactivity State Machine</text>
    <text x="690" y="586" class="box-sub">• Web Audio Dual-Frequency Siren Generator (440 Hz / 880 Hz Synthesizer)</text>
    <text x="690" y="606" class="box-sub">• Emergency SOS Trigger &amp; Automated SMS Dispatch to Trusted Guardians</text>
  </g>

</svg>
